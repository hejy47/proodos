[project]
name = "proodos"
version = "0.1.0"
description = "Causal-Aware Fault Localization and Automated Repair"
requires-python = ">=3.13"
dependencies = [
    "jsonlines==4.0.0",
    "openai==2.54.0",
    "pydantic>=2.12.0,<3",
    "tree-sitter==0.25.2",
    "tree-sitter-c==0.23.4",
    "tree-sitter-java==0.23.5",
]

[tool.uv]
add-bounds = "exact"

[tool.pytest.ini_options]
testpaths = ["tests"]

[dependency-groups]
dev = [
    "pytest==9.1.1",
]
